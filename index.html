<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Games</title>
<style>
  :root {
    color-scheme: light dark;
    --bg1: #eef2ff; --bg2: #f8fafc; --card: #ffffff;
    --ink: #1e293b; --muted: #64748b; --accent: #6366f1;
    --card-border: rgba(15,23,42,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #1e1b4b; --bg2: #0f172a; --card: #1a2036;
      --ink: #e7ecff; --muted: #94a3b8; --accent: #818cf8;
      --card-border: rgba(255,255,255,0.08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 32px; text-align: center; }
  .grid {
    display: grid;
    gap: 20px;
    width: 100%;
    max-width: 560px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
    transition: transform 0.15s ease;
  }
  a.card:hover { transform: translateY(-2px); }
  a.card .emoji { font-size: 2rem; display: block; margin-bottom: 10px; }
  a.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
  a.card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  a.card .play {
    display: inline-block;
    margin-top: 14px;
    color: var(--accent);
    font-weight: 600;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>Typing Games</h1>
  <p class="sub">Pick a game to play — works on phone, tablet, and desktop.</p>
  <div class="grid">
    <a class="card" href="typing-game.html">
      <span class="emoji">⌨️</span>
      <h2>Typing Activity</h2>
      <p>Type the sentence as fast and accurately as you can.</p>
      <span class="play">Play →</span>
    </a>
    <a class="card" href="meteor-typing-defense.html">
      <span class="emoji">☄️</span>
      <h2>Meteor Typing Defense</h2>
      <p>Type falling words to blast meteors before they hit your base.</p>
      <span class="play">Play →</span>
    </a>
  </div>
</body>
</html>
